// BUILD:ITEMS:END

const FIXES = [
  ["Sour or rotten smell", "Too wet / overfed", "Stop feeding 1 week; mix in <b>dry bedding</b> (shredded paper or cardboard)."],
  ["Worms crawling out", "Damp or contaminated", "Add <b>crushed eggshell</b>; check for sprayed or soapy scraps."],
  ["Fruit flies or gnats", "Food exposed", "Bury scraps under a fresh <b>dry top layer</b>."],
  ["Worms slow or sluggish", "Too cold / hot", "Hold bin at <b>55–77&deg;F</b>; move indoors in extremes."],
  ["Liquid pooling at base", "Overwatered", "Drain reservoir; add <b>dry bedding</b>, feed less."],
  ["Scraps not breaking down", "Pieces too large", "<b>Chop smaller</b>; feed only what disappears."],
];

const BADGE = { add: ["Add it","v-add"], prep: ["Prep first","v-prep"], no: ["Skip it","v-no"], ban: ["Never","v-ban"] };
const list = document.getElementById("list"), none = document.getElementById("none"), q = document.getElementById("q");
const legend = document.getElementById("legend");

let vFilter = null;     // active verdict chip, or null
let showAll = false;    // false = common items only in the browse view

const itemRow = it => {
  // Fallback keeps an unknown verdict visible instead of crashing the render.
  const [label, cls] = BADGE[it.v] || [it.v, "v-no"];
  return `<div class="item"><div><div class="nm">${it.n}</div>${it.note ? `<div class="note">${it.note}</div>` : ""}</div><span class="badge ${cls}">${label}</span></div>`;
};

// Token-prefix match: every search term must start a word in the name or
// keywords. Stops "egg" matching "veggies" while keeping multi-word queries.
const tokenize = s => s.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
const matchItem = (it, terms) => {
  const toks = tokenize(it.n + " " + (it.k || ""));
  return terms.every(t => toks.some(tok => tok.startsWith(t)));
};

// Render a run of rows already sorted add→prep→no→ban, inserting a verdict
// sub-landmark each time the verdict changes (breaks long same-color runs).
function renderRows(rows) {
  let html = "", cur = null;
  for (const it of rows) {
    if (it.v !== cur) {
      cur = it.v;
      const [label, cls] = BADGE[cur] || [cur, "v-no"];
      const n = rows.filter(r => r.v === cur).length;
      html += `<div class="vsub"><span class="dot ${cls}"></span>${label} · ${n}</div>`;
    }
    html += itemRow(it);
  }
  return html;
}

function clearFilters() {
  q.value = "";
  vFilter = null;
  legend.classList.remove("has-active");
  legend.querySelectorAll("button[data-v]").forEach(b => b.classList.remove("on"));
  draw();
}

function draw() {
  const terms = tokenize(q.value);
  const filtering = terms.length > 0 || !!vFilter;   // search or chip = flat, full database
  let pool = ITEMS;
  if (terms.length) pool = pool.filter(it => matchItem(it, terms));
  if (vFilter) pool = pool.filter(it => it.v === vFilter);

  if (filtering) {
    // Restate the scope so a guest knows filters reach the whole database.
    const bar = `<div class="viewbar"><span class="vw">Filtering all ${ITEMS.length} · ${pool.length} match${pool.length === 1 ? "" : "es"}</span><button class="clearf">Clear</button></div>`;
    list.innerHTML = bar + pool.map(itemRow).join("");
    none.hidden = pool.length > 0;
    if (!pool.length) none.querySelector("b").textContent = q.value.trim() || "that filter";
    const cb = list.querySelector(".clearf");
    if (cb) cb.addEventListener("click", clearFilters);
    return;
  }

  // Browse view: group by zone, common-only unless expanded.
  none.hidden = true;
  const browse = showAll ? ITEMS : ITEMS.filter(it => it.c);
  // Toggle at the top of the list, so switching views never requires scrolling.
  let html = showAll
    ? `<div class="viewbar"><span class="vw">Showing all ${ITEMS.length} items</span><button class="vtoggle">Show common only</button></div>`
    : `<div class="viewbar"><span class="vw">Showing ${browse.length} common items</span><button class="vtoggle">Show all ${ITEMS.length}</button></div>`;
  for (const [z, label] of ZONES) {
    const rows = browse.filter(it => it.z === z);
    if (!rows.length) continue;
    html += `<div class="zone-head"><h3>${label}</h3><span class="ct">${rows.length}</span></div>` + renderRows(rows);
  }
  // Bottom button mirrors the toggle, for whoever reached the end of the list.
  html += showAll
    ? `<button class="showall vtoggle">Show common items only</button>`
    : `<button class="showall vtoggle">Show all ${ITEMS.length} items</button>`;
  list.innerHTML = html;
  list.querySelectorAll(".vtoggle").forEach(b =>
    b.addEventListener("click", () => { showAll = !showAll; draw(); }));
}

q.addEventListener("input", draw);
legend.querySelectorAll("button[data-v]").forEach(btn => {
  btn.addEventListener("click", () => {
    vFilter = (vFilter === btn.dataset.v) ? null : btn.dataset.v;
    legend.classList.toggle("has-active", !!vFilter);
    legend.querySelectorAll("button[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === vFilter));
    draw();
  });
});
draw();

// Jump link → open and scroll to troubleshooting.
const off = document.getElementById("off");
document.getElementById("jump").addEventListener("click", () => {
  off.open = true;
  off.scrollIntoView({ behavior: "smooth", block: "start" });
});

// Back-to-top, appears past two screens.
const topBtn = document.getElementById("top");
topBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
addEventListener("scroll", () => topBtn.classList.toggle("show", scrollY > innerHeight * 2));

document.getElementById("fixes").innerHTML = FIXES.map(([sym, cause, how]) =>
  `<div class="fix"><div class="sym">${sym}</div><span class="cause">${cause}</span><div class="how">${how}</div></div>`).join("");
</script>
